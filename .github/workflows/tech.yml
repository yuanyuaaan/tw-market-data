name: tech

# Daily bars -> indicators and breadth, saved to data/*.json for the dashboard and the Claude reports.
# Taiwan: 15:40 and 16:40 Taipei on weekdays (FinMind usually has the day's bars by mid-afternoon;
#         the second run catches late data). US: 06:10 Taipei Tue–Sat, after the New York close.
# GitHub cron is UTC and often starts 5–20 minutes late.
on:
  schedule:
    - cron: "40 7 * * 1-5"
    - cron: "40 8 * * 1-5"
    - cron: "10 22 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "tw, us, or both"
        type: choice
        options: [both, tw, us]
        default: both

concurrency:
  group: tech
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tech:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pick markets
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.market }}";
          elif [ "${{ github.event.schedule }}" = "10 22 * * 1-5" ]; then m=us; else m=tw; fi
          [ "$m" = both ] && m="tw us"
          echo "markets=$m" >> "$GITHUB_OUTPUT"
      - name: Compute
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          for m in ${{ steps.pick.outputs.markets }}; do python -m tech.run_tech "$m"; done
      - name: Save results
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "tech-bot"
            git config user.email "tech-bot@users.noreply.github.com"
            git add data
            git commit -m "Update technical data"
            git pull --rebase
            git push
          fi
